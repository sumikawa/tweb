<!doctype html>
<html>
  <head>
    <title>css emphasis sample</title>
    <style>
      .bold {
        font-weight: bold;
      }

      .italic {
        font-style: italic;
      }

      .strike {
        text-decoration: line-through;
      }

      .under {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <p><span class="bold">Bold text</span></p>
      <p><span class="italic">Italic text</span></p>
      <p><span class="strike">Strike text</span></p>
      <p><span class="under">Under text</span></p>
    </main>
  </body>
</html>
