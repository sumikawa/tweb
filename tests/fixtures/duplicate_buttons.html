<!doctype html>
<html>
  <head>
    <title>Duplicate Buttons</title>
  </head>
  <body>
    <section>
      <form action="/first" method="get">
        <button name="slot" value="first">Search</button>
      </form>
    </section>
    <aside>
      <form action="/second" method="get">
        <button name="slot" value="second">Search</button>
      </form>
    </aside>
  </body>
</html>
