<!doctype html>
<html>
  <head>
    <title>Button Fetch</title>
  </head>
  <body>
    <p id="status">Idle</p>
    <button id="load-button" type="button">Load profile</button>
    <script>
      document.getElementById("load-button").addEventListener("click", () => {
        return fetch("/api/profile")
          .then((response) => response.text())
          .then((text) => {
            document.getElementById("status").textContent = text || "No data";
          });
      });
    </script>
  </body>
</html>
