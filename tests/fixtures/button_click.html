<!doctype html>
<html>
  <head>
    <title>Button Click</title>
  </head>
  <body>
    <div>
      <p id="status">Signed out</p>
      <label for="email">Email</label>
      <input id="email" type="email" value="user@example.com">
      <button id="login-button" type="button">Log in</button>
    </div>
    <script>
      document.getElementById("login-button").addEventListener("click", () => {
        document.getElementById("status").textContent = "Signed in as user@example.com";
      });
    </script>
  </body>
</html>
