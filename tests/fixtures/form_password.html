<!doctype html>
<html>
  <head>
    <title>Password Form Demo</title>
  </head>
  <body>
    <form action="/login" method="post">
      <label for="user">User</label>
      <input type="text" id="user" name="user" value="alice">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="secret">

      <button type="submit" name="go" value="1">Login</button>
    </form>
  </body>
</html>
